<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with LemHand Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* light gray background */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">

    <div id="app" class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Logo and Header -->
        <div class="px-8 pt-8 pb-6 text-center">
            <div class="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
               <!-- Placeholder for LAS Logo -->
                <img src="las_logo.png"></img>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Sign in</h2>
            <p class="text-sm text-gray-600 mt-2">to continue to <span id="client-name-display" class="font-semibold text-gray-800">LemHand Partner</span></p>
        </div>

        <!-- Error Alert -->
        <div id="error-container" class="hidden px-8 pb-4">
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p id="error-message" class="text-sm text-red-700"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form container -->
        <div id="form-container" class="hidden px-8 pb-8">
            <div class="space-y-4">
                <div>
                    <input type="email" id="email" class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm transition duration-150 ease-in-out" placeholder="Email address">
                </div>
                <div>
                    <input type="password" id="password" class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm transition duration-150 ease-in-out" placeholder="Password">
                </div>
            </div>

            <div class="mt-6 flex items-center justify-between">
                <div class="text-sm">
                    <a href="lemforgot.html" class="font-medium text-green-600 hover:text-green-500 transition duration-150 ease-in-out">Forgot password?</a>
                </div>
                <button onclick="handleSignIn()" id="submit-btn" class="group relative flex justify-center py-2.5 px-6 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors shadow-sm cursor-pointer">
                    Next
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-container" class="px-8 pb-12 flex flex-col items-center justify-center">
            <svg class="animate-spin h-8 w-8 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-sm text-gray-500 mt-4">Verifying request...</p>
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
            <span>LemHand Account Services</span>
            <div class="space-x-4">
                <a href="#" class="hover:text-gray-900 transition underline-offset-2 hover:underline">Help</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

        // Firebase Configuration (from lemlog.html / app.js)
        const firebaseConfig = {
            apiKey: "AIzaSyCWp6dqShdHCCtvLlJA03QMMqqb6LSePSU",
            authDomain: "lemhand-6de2a.firebaseapp.com",
            databaseURL: "https://lemhand-6de2a-default-rtdb.firebaseio.com",
            projectId: "lemhand-6de2a",
            storageBucket: "lemhand-6de2a.appspot.com",
            messagingSenderId: "148302455321",
            appId: "1:148302455321:web:4f899d96f460842e868088",
            measurementId: "G-M96JLWHLSP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const loadingContainer = document.getElementById('loading-container');
        const formContainer = document.getElementById('form-container');
        const errorContainer = document.getElementById('error-container');
        const errorMessageDiv = document.getElementById('error-message');
        const clientNameDisplay = document.getElementById('client-name-display');
        const submitBtn = document.getElementById('submit-btn');

        // URL Params
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client_id');
        const redirectUri = urlParams.get('redirect_uri');

        let verifiedRedirectUri = null;

        function showError(message) {
            loadingContainer.classList.add('hidden');
            formContainer.classList.add('hidden');
            errorContainer.classList.remove('hidden');
            errorMessageDiv.textContent = message;
        }

        async function init() {
            if (!clientId || !redirectUri) {
                showError("Invalid request. Missing client_id or redirect_uri.");
                return;
            }

            try {
                // Verify Client in Firestore
                const clientRef = doc(db, 'las_clients', clientId);
                const clientSnap = await getDoc(clientRef);

                if (clientSnap.exists()) {
                    const clientData = clientSnap.data();
                    
                    // Verify redirect_uri is in allowed_redirect_uris
                    if (clientData.allowed_redirect_uris && clientData.allowed_redirect_uris.includes(redirectUri)) {
                        // Authorized!
                        verifiedRedirectUri = redirectUri;
                        clientNameDisplay.textContent = clientData.name || clientId;
                        
                        loadingContainer.classList.add('hidden');
                        formContainer.classList.remove('hidden');
                    } else {
                        showError("Security Error: Unauthorized redirect URI for this client.");
                    }
                } else {
                    showError("Security Error: Invalid client ID. The requested service is not authorized to use LemHand Account Services.");
                }
            } catch (error) {
                console.error("Error verifying client:", error);
                showError("An network error occurred while verifying the request. Please try again.");
            }
        }

        window.handleSignIn = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError("Please enter both email and password.");
                formContainer.classList.remove('hidden');
                return;
            }

            if (!verifiedRedirectUri) {
                return;
            }

            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');
            errorContainer.classList.add('hidden');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Construct redirect URL
                const redirectUrl = new URL(verifiedRedirectUri);
                redirectUrl.searchParams.append('email', user.email);
                
                // Add name if available
                if (user.displayName) {
                    redirectUrl.searchParams.append('name', user.displayName);
                }

                redirectUrl.searchParams.append('success', 'true');

                window.location.href = redirectUrl.toString();

            } catch (error) {
                console.error(error);
                submitBtn.textContent = 'Next';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
                
                let message = "An error occurred.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    message = "Invalid email or password.";
                } else if (error.code === 'auth/too-many-requests') {
                    message = "Too many failed attempts. Please try again later.";
                } else {
                    message = error.message;
                }
                
                showError(message);
                formContainer.classList.remove('hidden'); // Ensure form is still visible
            }
        };

        // Initialize verification on load
        init();
    </script>
</body>
</html>
