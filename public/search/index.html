<body class="bg-gray-900" id="app" @auth-event="onAuthEvent">

    <header class="header">
        <p href="#" class="logo">LemHand</p>
        <i class='bx bx-menu' id="menu-icon"></i>
        <nav class="navbar">
            <a href="/index.html" v-on:click="this.currentpage = 'home'">Home</a>

            <a href="/index.html" v-on:click="this.currentpage = 'news'">News</a>
            <a class="has-text-success" href="lemhand/index.html">Search</a>

    <div class="nav-bg"></div>
    <br> 
    <br>
    <br>
    <main>
    <div class="hero is-info" style="background-color:#e2f0d5">

        <div class="hero-body">
                        <h1 class="title is-1 logo" style="text-align: center;">LemHand</h1>
                        <h1 class="subtitle is-6" style="text-align: center; color:black">Powered by Google Search</h1>
                        <div class="buttons">

                           <div class="field ddw has-addons">

                                        </svg>                                    
                                    </span>
                                </div>

                                    </div>
