<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LemHand Search</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        primary: '#10B981', // Emerald 500
                        secondary: '#3B82F6', // Blue 500
                        dark: '#111827', // Gray 900
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

<body class="bg-gray-950 text-white min-h-screen flex flex-col selection:bg-primary selection:text-white" x-data="{ mobileMenuOpen: false }">

    <!-- Navigation -->
    <header class="fixed top-0 left-0 w-full z-50 glass border-b border-white/10 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/index.html" class="text-2xl font-bold tracking-tighter hover:text-primary transition-colors">
                Lem<span class="text-primary">Hand</span>
            </a>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex items-center space-x-8">
                <a href="/index.html" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Home</a>
                <a href="/index.html" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Software</a>
                <a href="/index.html" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Blog</a>
                <a href="#" class="text-sm font-medium text-primary transition-colors">Search</a>
            </nav>

            <!-- Mobile Menu Button -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden text-2xl text-white">
                <i :class="mobileMenuOpen ? 'bx bx-x' : 'bx bx-menu'"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div v-show="mobileMenuOpen" class="md:hidden absolute top-20 left-0 w-full bg-gray-900 border-b border-white/10 p-6 flex flex-col space-y-4 shadow-2xl">
            <a href="/index.html" class="text-lg font-medium text-gray-300">Home</a>
            <a href="/index.html" class="text-lg font-medium text-gray-300">Software</a>
            <a href="/index.html" class="text-lg font-medium text-gray-300">Blog</a>
            <a href="#" class="text-lg font-medium text-primary">Search</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 pt-20 relative overflow-hidden">
        
        <!-- Background Orbs -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
            <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[100px]"></div>
        </div>

        <div class="w-full max-w-3xl text-center z-10">
            <h1 class="text-5xl md:text-6xl font-bold mb-4 tracking-tighter">
                Lem<span class="text-primary">Search</span>
            </h1>
            <p class="text-gray-400 mb-10 text-lg">Powered by Google</p>

            <form action="https://www.google.com/search" method="get" class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary rounded-full opacity-30 group-hover:opacity-100 blur transition duration-500"></div>
                <div class="relative flex items-center bg-gray-900 rounded-full border border-white/10 group-hover:border-white/30 transition-all p-2 shadow-2xl">
                    <div class="pl-6 text-gray-400">
                        <i class='bx bx-search text-2xl'></i>
                    </div>
                    <input type="hidden" name="sitesearch" value="">
                    <input type="text" name="q" class="w-full bg-transparent border-none text-white text-lg px-4 py-3 focus:outline-none focus:ring-0 placeholder-gray-500" placeholder="Search the web or type a URL..." autofocus autocomplete="off">
                    <button type="submit" class="px-8 py-3 bg-primary hover:bg-green-500 text-gray-900 font-bold rounded-full transition-all transform hover:scale-105">
                        Search
                    </button>
                </div>
            </form>

            <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-4 max-w-2xl mx-auto">
                <a href="https://bus.lemhand.com" class="p-4 rounded-xl bg-white/5 border border-white/5 hover:border-yellow-500/50 hover:bg-yellow-500/10 transition-all group flex flex-col items-center gap-2">
                    <i class='bx bx-bus text-2xl text-yellow-500 group-hover:scale-110 transition-transform'></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">BusTracker</span>
                </a>
                <a href="/index.html" class="p-4 rounded-xl bg-white/5 border border-white/5 hover:border-blue-500/50 hover:bg-blue-500/10 transition-all group flex flex-col items-center gap-2">
                    <i class='bx bx-home text-2xl text-blue-500 group-hover:scale-110 transition-transform'></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Home</span>
                </a>
                <a href="https://quizzy-online.web.app" class="p-4 rounded-xl bg-white/5 border border-white/5 hover:border-purple-500/50 hover:bg-purple-500/10 transition-all group flex flex-col items-center gap-2">
                    <i class='bx bx-question-mark text-2xl text-purple-500 group-hover:scale-110 transition-transform'></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Quizzy</span>
                </a>
                <a href="https://buyouiu.web.app" class="p-4 rounded-xl bg-white/5 border border-white/5 hover:border-pink-500/50 hover:bg-pink-500/10 transition-all group flex flex-col items-center gap-2">
                    <i class='bx bx-store text-2xl text-pink-500 group-hover:scale-110 transition-transform'></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Oui U</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 text-center text-gray-600 text-sm">
        <p>© 2026 LemHand. All rights reserved.</p>
    </footer>

</body>
</html>
